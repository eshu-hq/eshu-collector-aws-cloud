apiVersion: eshu.dev/v1alpha1
kind: ComponentPackage
metadata:
  id: collector-aws-cloud
  name: AWS Cloud collector
  publisher: eshu-hq
  version: 0.1.0
spec:
  compatibleCore: ">=0.0.5 <0.2.0"
  componentType: collector
  collectorKinds:
    - aws
  runtime:
    sdkProtocol: collector-sdk/v1alpha1
    adapter: process
  artifacts:
    - platform: linux/amd64
      image: ghcr.io/eshu-hq/eshu-collector-aws-cloud@sha256:4d5d3a979b6b3d3e5b413e85c3c57046dbcf2a0da24dcf81a4489d99db55aa9d
  emittedFacts:
    - kind: aws_resource
      payloadSchemaRef: aws_resource
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: aws_relationship
      payloadSchemaRef: aws_relationship
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: aws_image_reference
      payloadSchemaRef: aws_image_reference
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: aws_warning
      payloadSchemaRef: aws_warning
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: ec2_instance_posture
      payloadSchemaRef: ec2_instance_posture
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: rds_instance_posture
      payloadSchemaRef: rds_instance_posture
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    # TRANSITIONAL placeholder families: emitted by the scaffold pipeline
    # until the AWS logic port lands (PORT_PLAN.md). The port removes these
    # and declares remaining bare AWS kinds (schema 1.0.0, reported)
    # after typed emission and trusted host grant context are ready (#8909).
    # The standalone SDK accepts these kinds through trusted CoreFacts;
    # fixture-only synthetic context does not grant production authority.
    - kind: collector-aws-cloud.snapshot
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: collector-aws-cloud.record
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: collector-aws-cloud.warning
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
  consumerContracts:
    reducer:
      phases:
        - aws_cloud_runtime_drift
  telemetry:
    metricsPrefix: eshu_dp_aws_cloud_collector_
