host:
  sourceSystem: aws
  scope:
    id: component:aws-cloud-primary
    kind: component
process:
  command: ./collector
  args:
    - --sdk-stdio
config:
  source:
    mode: local-file
    input: ./testdata/complete.json
    sourceURI: https://example.invalid/source/aws-cloud
  freshness:
    previousDigest: ""
  limits:
    maxRecordsPerClaim: 5000
    maxPayloadBytes: 65536
    claimTimeoutSeconds: 300
# Live mode: the host activation config carries no source.input. The
# collector then lists live AWS resources for the target account across the
# allowed regions and services (the 19 names in internal/live), using the
# ambient credential chain only (IRSA, container or instance role). A
# present-but-empty source.input behaves as absent.
