# CI gates for eshu-collector-aws-cloud. Lane contract (see CONTRIBUTING.md):
# frozen job names lint, test, race, shell, image, govulncheck, gosec, with
# ci-complete as the only required context. A PR pays only for lanes its
# paths can affect; push-to-main records every lane; the weekly schedule
# runs govulncheck and gosec only.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_FLOOR: 79
  GOLANGCI_VERSION: v2.12.2
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - id: filter
        uses: dorny/paths-filter@v3 # 0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'manifest.yaml'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'

  lint:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - run: golangci-lint run ./...
      - run: test -z "$(golangci-lint fmt --diff ./... 2>/dev/null)"
      - run: go mod tidy -diff
      - run: test -z "$(git ls-files '*.go' | xargs wc -l | grep -v ' total$' | awk '$1 > 500')"
      - if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${{ env.ACTIONLINT_VERSION }}
          actionlint

  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflows == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -count=1

  race:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - run: |
          go tool cover -func=coverage.out > cover.func
          total=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' cover.func)
          echo "total=${total}% floor=${{ env.COVERAGE_FLOOR }}%"
          {
            echo "## Coverage"
            echo ""
            echo "Total ${total}% (floor ${{ env.COVERAGE_FLOOR }}%). Per-package statement coverage:"
            echo ""
            echo "| Package | Covered | Statements | Coverage |"
            echo "| --- | --- | --- | --- |"
            awk -F'[:,]' 'NR > 1 {file=$1; pkg=file; sub(/\/[^/]*$/, "", pkg); stmts[pkg]+=$3; if ($4 > 0) cov[pkg]+=$3} END {for (p in stmts) printf "| %s | %d | %d | %.1f%% |\n", p, cov[p]+0, stmts[p], 100*(cov[p]+0)/stmts[p]}' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v floor="${{ env.COVERAGE_FLOOR }}" 'BEGIN {exit !(total + 0 >= floor + 0)}'
      - uses: actions/upload-artifact@v4 # ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-profile
          path: |
            coverage.out
            cover.func
          retention-days: 14

  shell:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - run: git ls-files '*.sh' | xargs shellcheck

  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t collector:ci .
      - run: |
          test -f .dockerignore
          test -z "$(grep -E '^FROM ' Dockerfile | grep -v '@sha256:')"
          grep -E -q 'image: .*@sha256:[0-9a-f]{64}' manifest.yaml
          test "$(awk '/^go / {print $2}' go.mod)" = "$(grep -E -o 'golang:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)"

  govulncheck:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deps == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck -scan package ./...
      - if: failure() && github.event_name == 'schedule'
        run: |
          title="govulncheck findings $(date -u +%F)"
          open=$(gh issue list --search "$title" --state open --json number --jq 'length')
          test "$open" -gt 0 || gh issue create --title "$title" --label security --body "Weekly govulncheck run failed; see the linked run."

  gosec:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - run: gosec -no-fail -fmt=sarif -out gosec.sarif ./...
      - run: |
          count=$(jq '[.runs[].results[]] | length' gosec.sarif)
          echo "gosec findings: ${count}" >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v3 # 4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  ci-complete:
    if: always()
    needs: [changes, lint, test, race, shell, image, govulncheck, gosec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          printf '%s\n' '${{ toJSON(needs) }}' | python3 -c "import json,sys; sys.exit(1 if any(j.get('result') in ('failure', 'cancelled') for j in json.load(sys.stdin).values()) else 0)"
