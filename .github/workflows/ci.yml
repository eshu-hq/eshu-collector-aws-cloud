# CI gates for eshu-collector-aws-cloud. Lane contract (see CONTRIBUTING.md):
# frozen job names lint, test, race, shell, image, govulncheck, gosec, with
# ci-complete as the only required context. A PR pays only for lanes its
# paths can affect; push-to-main and a manual workflow_dispatch run record
# every lane; the weekly schedule runs govulncheck and gosec only.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_FLOOR: 79
  GOLANGCI_VERSION: v2.12.2
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - id: filter
        uses: dorny/paths-filter@v4 # 0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'manifest.yaml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed (epic
              # rule: test-class iff a test opens it or go:embed reaches
              # it): testdata/** via conformance_test.go:375
              # (os.ReadFile testdata/+name), **/*.json via
              # grant_test.go:106 (grant.example.json) and
              # conformance_test.go:375 (testdata/*.json), manifest.yaml
              # via conformance_test.go:401 plus manifest.go:13 (go:embed
              # manifest.yaml), grant.example.json explicit (also under
              # **/*.json). NOT fixtures: config.example.yaml has no test
              # readers (README-only) and .github/dependabot.yml has none
              # either, so both stay out; dependabot.yml lands in misc.
              - 'testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
              - 'grant.example.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
              - 'go.mod'
              - 'go.sum'
            workflows:
              - '.github/workflows/**'
            misc:
              # Fail-closed default required by the epic: anything not
              # classified above runs the full Go lanes (issue #6: a PR
              # touching only .gitignore ran zero lanes). The docs skip
              # set stays negated so docs-only PRs keep skipping; every
              # classified pattern is negated too so narrow lanes
              # (fixtures/shell/image) keep their shape. Proven by the
              # docs-only / shell-only / fixture-only / unclassified-only
              # skip-proof PRs on the fix branch.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!config.example.yaml'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!grant.example.json'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  lint:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v7 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - run: golangci-lint run ./...
      - run: test -z "$(golangci-lint fmt --diff ./... 2>/dev/null)"
      - run: go mod tidy -diff
      - run: test -z "$(git ls-files '*.go' | xargs wc -l | grep -v ' total$' | awk '$1 > 500')"
      - if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${{ env.ACTIONLINT_VERSION }}
          actionlint

  test:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v7 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -count=1

  race:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v7 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - run: |
          go tool cover -func=coverage.out > cover.func
          total=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' cover.func)
          echo "total=${total}% floor=${{ env.COVERAGE_FLOOR }}%"
          {
            echo "## Coverage"
            echo ""
            echo "Total ${total}% (floor ${{ env.COVERAGE_FLOOR }}%). Per-package statement coverage:"
            echo ""
            echo "| Package | Covered | Statements | Coverage |"
            echo "| --- | --- | --- | --- |"
            awk 'NR > 1 {n=split($1, a, ":"); file=a[1]; pkg=file; sub(/\/[^/]*$/, "", pkg); stmts[pkg]+=$2; if ($3 > 0) cov[pkg]+=$2} END {for (p in stmts) printf "| %s | %d | %d | %.1f%% |\n", p, cov[p]+0, stmts[p], 100*(cov[p]+0)/stmts[p]}' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v floor="${{ env.COVERAGE_FLOOR }}" 'BEGIN {exit !(total + 0 >= floor + 0)}'
      - uses: actions/upload-artifact@v7 # ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-profile
          path: |
            coverage.out
            cover.func
          retention-days: 14

  shell:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - run: git ls-files '*.sh' | xargs shellcheck

  image:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t collector:ci .
      - run: |
          test -f .dockerignore
          test -z "$(grep -E '^FROM ' Dockerfile | grep -v '@sha256:')"
          grep -E -q 'image: .*@sha256:[0-9a-f]{64}' manifest.yaml
          test "$(awk '/^go / {print $2}' go.mod)" = "$(grep -E -o 'golang:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)"

  govulncheck:
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deps == 'true' || (needs.changes.result != 'success' && github.event_name != 'pull_request' && github.event_name != 'schedule'))
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v7 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck -scan package ./...
      - if: failure() && github.event_name == 'schedule'
        run: |
          title="govulncheck findings $(date -u +%F)"
          open=$(gh issue list --search "$title" --state open --json number --jq 'length')
          test "$open" -gt 0 || gh issue create --title "$title" --label security --body "Weekly govulncheck run failed; see the linked run."

  gosec:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      issues: write # scheduled runs file or update a findings issue
    steps:
      - uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v7 # 40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      # -no-fail: findings are advisory on PRs and pushes; the count below
      # is the gate. Advisory until the false-positive rate here is
      # measured; triage happens in the open, never blanket-excluded.
      - run: gosec -no-fail -fmt=sarif -out=gosec.sarif ./...
      - run: |
          count=$(jq '[.runs[].results[]] | length' gosec.sarif)
          echo "gosec findings: ${count}" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: ${count}"
          # Findings fail scheduled runs so the `failure()`-gated issue
          # step below is reachable; other events stay advisory green.
          if [ "${count:-0}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "gosec findings on a scheduled run; failing to file the issue."
            exit 1
          fi
      - uses: github/codeql-action/upload-sarif@v4 # 4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="gosec findings $(date -u +%F)"
          body="Scheduled gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  ci-complete:
    if: always()
    needs: [changes, lint, test, race, shell, image, govulncheck, gosec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          printf '%s\n' '${{ toJSON(needs) }}' | python3 -c "import json,sys; sys.exit(1 if any(j.get('result') in ('failure', 'cancelled') for j in json.load(sys.stdin).values()) else 0)"
