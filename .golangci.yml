version: "2"
linters:
  # No separate gosimple entry: golangci-lint v2 has no `gosimple`
  # linter (naming it fails the run with "unknown linters"); the S-class
  # (gosimple-origin) checks run under `staticcheck`.
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
formatters:
  enable:
    - gofumpt
issues:
  # The default of 50 hides backlog behind nondeterministic windows.
  # Leave the census uncapped so the gate always reports every finding.
  max-issues-per-linter: 0
  max-same-issues: 0
