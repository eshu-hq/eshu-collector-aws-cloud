version: "2"
linters:
  # No separate gosimple entry: golangci-lint v2 folds the S-class
  # (gosimple-origin) checks into staticcheck — verified by an S1008 probe
  # firing with only this set enabled. Adding `gosimple` fails the run
  # with "unknown linters".
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
formatters:
  enable:
    - gofumpt
issues:
  # The default of 50 hides backlog behind nondeterministic windows.
  # Leave the census uncapped so the gate always reports every finding.
  max-issues-per-linter: 0
  max-same-issues: 0
